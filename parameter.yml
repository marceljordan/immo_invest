# PL_Master : connexion utilisée par Invoke_pipeline_ingest
key_value_replace:

  # ============================================================
  # PL_Master - Invoke PL
  # ============================================================

  - find_key: $.properties.activities[?(@.name=="Invoke_pipeline_ingest")].typeProperties.pipelineId
    replace_value:
      TEST: "$items.DataPipeline.PL.$id"
      PROD: "$items.DataPipeline.PL.$id"
    item_type: "DataPipeline"
    item_name: "PL_Master"

  - find_key: $.properties.activities[?(@.name=="Invoke_pipeline_ingest")].typeProperties.workspaceId
    replace_value:
      TEST: "$workspace.$id"
      PROD: "$workspace.$id"
    item_type: "DataPipeline"
    item_name: "PL_Master"

  - find_key: $.properties.activities[?(@.name=="Invoke_pipeline_ingest")].externalReferences.connection
