name: Validate for PROD

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fabric-cicd azure-identity

          # Versions stables compatibles
          pip install "dbt-core==1.11.14" "dbt-fabric==1.11.1"

          # Patch temporaire du bug dbt-fabric 1.11.1 :
          # mssql-python ne supporte pas "Authority Id"
          python - <<'PY'
          from pathlib import Path
          import dbt.adapters.fabric.fabric_connection_manager as fcm

          path = Path(fcm.__file__)
          text = path.read_text()

          bad_line = '            con_str.append(f"Authority Id={{{credentials.tenant_id}}}")\n'

          if bad_line not in text:
              raise RuntimeError(
                  f"Expected Authority Id line not found in {path}"
              )

          path.write_text(
              text.replace(bad_line, "")
          )

          print(f"Patched dbt-fabric connection manager: {path}")
          PY

          dbt --version

      - name: Install ODBC Driver
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      # 1. Vérifie que les artefacts Fabric se déploient correctement dans TEST
      - name: Deploy to Fabric TEST
        env:
          AZURE_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
        run: |
          python cicd/deploy.py \
            --environment TEST \
            --workspace-id "${{ secrets.FABRIC_WORKSPACE_TEST_ID }}"

      # 2. Construit les modèles dbt et exécute les tests dans WH_Immo_Test
      - name: Run dbt
        env:
          AZURE_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
        run: |
          cd dbt.DataBuildToolJob/Code/dbt

          dbt deps

          dbt build \
            --target test \
            --profiles-dir ../../../

      # Toujours conserver le SQL compilé pour diagnostiquer un éventuel échec
      - name: Upload dbt target (compiled SQL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: dbt.DataBuildToolJob/Code/dbt/target/
          retention-days: 7

      # 3. Vérifie que le modèle sémantique fonctionne avec le binding TEST
      - name: Refresh semantic model
        if: success()
        env:
          AZURE_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
        run: |
          python cicd/refresh_semantic_model.py \
            --group-id "${{ secrets.FABRIC_WORKSPACE_TEST_ID }}" \
            --dataset-name "SM_IMMO_ANALYTICS_DEV"
